<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTTP Client</title><link rel="stylesheet" href="style.css"><script src="main.js" defer></script></head>
<body>
<header><strong>HTTP Client</strong><span class="spacer"></span><span class="shortcut">⌘ / Ctrl ↵</span><button id="cancel" data-i18n="cancel" disabled></button><button id="send" class="primary" data-i18n="send" disabled></button></header>
<main>
<section class="request-pane"><div class="bar"><label for="source" data-i18n="source"></label><span class="spacer"></span><button id="parse" data-i18n="parse"></button></div>
<div class="selection"><select id="requests" data-label="select"></select></div>
<textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" data-label="source"></textarea></section>
<section class="response-pane"><div class="bar"><span data-i18n="response"></span><span id="metrics" class="spacer"></span><span id="code"></span></div>
<div class="response-tools"><button id="body-tab" aria-pressed="true" data-i18n="body"></button><button id="headers-tab" aria-pressed="false" data-i18n="headers"></button><span class="spacer"></span><label class="pretty-label"><input type="checkbox" id="pretty" checked><span data-i18n="pretty"></span></label></div>
<textarea id="response" readonly spellcheck="false" data-label="response"></textarea><p id="notice" hidden></p></section>
</main><footer><span id="status" role="status" aria-live="polite"></span><span class="spacer"></span><span data-i18n="memory" class="memory"></span></footer>
</body></html>
